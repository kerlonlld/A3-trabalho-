<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — UNIQ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👕</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background: var(--gray-50); min-height: 100vh; display: flex; flex-direction: column; }
    .login-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-2xl) var(--space-lg); }
    .login-container { width: 100%; max-width: 440px; }
    .login-logo { text-align: center; margin-bottom: var(--space-xl); }
    .login-logo a { font-family: var(--font-display); font-size: 2rem; font-weight: 800; color: var(--primary); }
    .login-logo a span { color: var(--accent); }
    .login-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-xl); padding: var(--space-2xl); box-shadow: var(--shadow-md); }
    .login-tabs { display: flex; border-bottom: 2px solid var(--gray-200); margin-bottom: var(--space-xl); }
    .login-tab { flex: 1; padding: var(--space-md); text-align: center; font-size: 0.9rem; font-weight: 600; color: var(--gray-500); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all var(--transition-fast); }
    .login-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .login-panel { display: none; }
    .login-panel.active { display: block; }
    .form-group { margin-bottom: var(--space-md); }
    .form-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
    .form-input { width: 100%; padding: 13px 16px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-md); font-size: 0.9rem; font-family: inherit; outline: none; color: var(--primary); transition: border-color var(--transition-fast); }
    .form-input:focus { border-color: var(--accent); }
    .input-with-icon { position: relative; }
    .input-with-icon .form-input { padding-right: 48px; }
    .input-icon-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 0.95rem; }
    .forgot-link { font-size: 0.75rem; color: var(--accent); float: right; margin-top: -var(--space-md); }
    .forgot-link:hover { text-decoration: underline; }
    .login-btn { width: 100%; margin-top: var(--space-sm); }
    .or-divider { display: flex; align-items: center; gap: var(--space-md); margin: var(--space-lg) 0; color: var(--gray-400); font-size: 0.8rem; }
    .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }
    .social-login { display: flex; flex-direction: column; gap: var(--space-sm); }
    .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 600; color: var(--primary); background: var(--white); cursor: pointer; transition: all var(--transition-fast); }
    .social-btn:hover { border-color: var(--primary); background: var(--gray-50); }
    .social-btn .google-icon { font-size: 1rem; }
    .terms-text { font-size: 0.72rem; color: var(--gray-400); text-align: center; margin-top: var(--space-md); line-height: 1.6; }
    .terms-text a { color: var(--accent); }
    .login-back { text-align: center; margin-top: var(--space-lg); font-size: 0.875rem; color: var(--gray-500); }
    .login-back a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>

<div class="login-page">
  <div class="login-container">
    <div class="login-logo">
      <a href="index.html">UN<span>IQ</span></a>
    </div>

    <div class="login-card">
      <div class="login-tabs">
        <div class="login-tab active" onclick="switchTab('login')">Entrar</div>
        <div class="login-tab" onclick="switchTab('cadastro')">Criar conta</div>
      </div>

      <!-- Login -->
      <div class="login-panel active" id="panel-login">
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input class="form-input" type="email" placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">
            Senha
            <a href="#" class="forgot-link" style="float:right">Esqueci minha senha</a>
          </label>
          <div class="input-with-icon">
            <input class="form-input" type="password" id="login-password" placeholder="••••••••">
            <button class="input-icon-btn" onclick="togglePass('login-password', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:0.8rem;color:var(--gray-600);margin-bottom:var(--space-md);cursor:pointer">
          <input type="checkbox" style="accent-color:var(--accent)"> Lembrar de mim
        </label>
        <button class="btn btn-primary login-btn" onclick="doLogin()">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>

        <div class="or-divider">ou continue com</div>
        <div class="social-login">
          <button class="social-btn" onclick="showToast('Login social disponível em breve!','info')">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continuar com Google
          </button>
        </div>
      </div>

      <!-- Cadastro -->
      <div class="login-panel" id="panel-cadastro">
        <div class="form-group">
          <label class="form-label">Nome completo</label>
          <input class="form-input" type="text" placeholder="Seu nome completo">
        </div>
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input class="form-input" type="email" placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <div class="input-with-icon">
            <input class="form-input" type="password" id="cad-password" placeholder="Mínimo 8 caracteres">
            <button class="input-icon-btn" onclick="togglePass('cad-password', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar senha</label>
          <div class="input-with-icon">
            <input class="form-input" type="password" id="cad-password2" placeholder="Repita a senha">
            <button class="input-icon-btn" onclick="togglePass('cad-password2', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
        <button class="btn btn-primary login-btn" onclick="doCadastro()">
          <i class="fa-solid fa-user-plus"></i> Criar conta
        </button>
        <p class="terms-text">
          Ao criar uma conta, você concorda com nossos
          <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade (LGPD)</a>.
        </p>
      </div>
    </div>

    <div class="login-back">
      <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar para a loja</a>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
<script>
function switchTab(tab) {
  document.querySelectorAll('.login-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'cadastro'));
  });
  document.getElementById('panel-login').classList.toggle('active', tab === 'login');
  document.getElementById('panel-cadastro').classList.toggle('active', tab === 'cadastro');
}

function togglePass(id, btn) {
  const input = document.getElementById(id);
  const icon = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fa-regular fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fa-regular fa-eye';
  }
}

function doLogin() {
  const btn = event.target;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';
  btn.disabled = true;
  setTimeout(() => {
    showToast('Login realizado com sucesso!', 'success');
    setTimeout(() => window.location.href = 'index.html', 1000);
  }, 1500);
}

function doCadastro() {
  const btn = event.target;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Criando conta...';
  btn.disabled = true;
  setTimeout(() => {
    showToast('Conta criada com sucesso!', 'success');
    setTimeout(() => window.location.href = 'index.html', 1000);
  }, 1500);
}
</script>
</body>
</html>
